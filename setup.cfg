# Package metadata. It lives here rather than in a [project] table of pyproject.toml on
# purpose: setuptools has read setup.cfg since version 30, but reads [project] only from
# version 61, and an older setuptools (common on clusters) ignores [project] silently and
# installs an empty "UNKNOWN-0.0.0" package.
[metadata]
name = archaeahq-update
version = attr: archaeahq_update.__version__
description = Keep ArchaeaHQ, the curated reference database of archaeal genomes, up to date with NCBI
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE
author = Pedro Leão, Vee Lab - Radboud University
url = https://vee-lab.eu/archaeahq
project_urls =
    Dataset = https://figshare.com/articles/dataset/ArchaeaHQ_v_1_00_2026/32266599
    Repository = https://github.com/Pedrolleao/archaeahq-update
keywords = archaea, genomes, database, NCBI, CheckM2, skani, metagenomics
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: POSIX
    Topic :: Scientific/Engineering :: Bio-Informatics
    Environment :: Console

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
# Python-side dependencies only. The external tools (checkm2, ncbi-datasets-cli, skani, barrnap,
# aragorn) come from conda: see src/archaeahq_update/data/environment.yml or the bioconda package.
install_requires =
    rich>=13
    requests>=2.25
    tqdm>=4.60

[options.packages.find]
where = src

[options.package_data]
archaeahq_update = data/*.tsv, data/*.json, data/environment.yml

[options.extras_require]
sankey = plotly>=5; kaleido==0.2.1; pillow
test = pytest>=7

[options.entry_points]
console_scripts =
    archaeahq-update = archaeahq_update.cli:main
